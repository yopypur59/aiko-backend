name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: UV_GIT_LFS=1 uv sync --dev

    - name: Run credential-free project tests
      run: uv run pytest -v tests/test_transcript_store.py

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Verify production image builds
      run: docker build -t aiko:ci .
